<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA HEAL - Graphs</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        :root {
            --bg-base: #050505;
            --surface-primary: #0A0A0A;
            --surface-secondary: #111111;
            --surface-card: #151515;
            --surface-card-hover: #1A1A1A;
            
            --border-subtle: #262626;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.35);
            
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1A1;
            --text-muted: #666666;
            --text-dim: #444444;
            
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --card-radius: 12px;
            --shadow-subtle: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }

        /* ================= HEADER ================= */

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 10000;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .logo::before {
            content: "◈";
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #111111;
            border: 1px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .logo:hover::before {
            border-color: #FFFFFF;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        .logo span {
            color: var(--text-primary);
            font-weight: 700;
        }

        .logo::after {
            content: "OBSERVABILITY";
            font-family: var(--font-mono);
            font-size: 0.65rem;
            padding: 0.15rem 0.45rem;
            background: var(--surface-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 4px;
        }

        /* ================= NAVIGATION ================= */

        .navbar {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            height: 55px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 12px;
            z-index: 9999;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .navbar a {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .navbar a:hover {
            background: var(--surface-secondary);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .navbar a.active {
            background: var(--surface-card);
            border-color: var(--border-subtle);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .nav-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 4px 6px 4px 12px;
            min-width: min(340px, 28vw);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-search:focus-within {
            border-color: var(--border-active);
            background: var(--surface-card);
        }

        .nav-search input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            min-width: 0;
            font-family: var(--font-main);
        }

        .nav-search input::placeholder {
            color: var(--text-muted);
        }

        .nav-search button {
            border: 1px solid #FFFFFF;
            background: #FFFFFF;
            color: #000000;
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }

        .nav-search button:hover {
            background: #E5E5E5;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* ================= MAIN ================= */

        .main {
            position: relative;
            top: 125px;
            left: 0;
            right: 0;
            padding: 24px 30px 48px;
            overflow: visible;
            min-height: calc(100vh - 125px);
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: 1.95rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-family: var(--font-main);
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* ================= GRAPH GRID ================= */

        .graphs-grid {
            width: 100%;
            min-height: 760px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        /* ================= GRAPH CARD ================= */

        .graph-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 1.25rem;
            min-height: 300px;
            height: 100%;
            box-shadow: var(--shadow-subtle);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .graph-card:hover {
            background: var(--surface-card-hover);
            border-color: var(--border-active);
            transform: translateY(-2px);
        }

        .graph-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .graph-title h3 {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .status {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .chart-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 260px;
            min-height: 260px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {
            body {
                overflow: auto;
            }

            .main {
                position: relative;
                top: 125px;
                padding-bottom: 30px;
                overflow: visible;
            }

            .graphs-grid {
                height: auto;
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 300px);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            AURA<span> HEAL</span>
        </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="./index3.html">Dashboard</a>
            <a href="./graphs.html" class="active">Graphs</a>
            <a href="./logs.html">Logs</a>
            <a href="./system-information.html">System Information</a>
            <a href="./vm.html">VM</a>
        </div>

        <div class="nav-search">
            <input type="search" placeholder="Search graphs, metrics..." aria-label="Search system">
            <button type="button">Search</button>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main">

        <h1 class="page-title">System Graphs</h1>

        <p class="page-subtitle">
            Real-time system performance monitoring
        </p>

        <div class="graphs-grid">

            <!-- CPU -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>CPU Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                </div>

            </div>

            <!-- MEMORY -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Memory Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="memoryChart"></canvas>
                </div>

            </div>

            <!-- DISK -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Disk Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="diskChart"></canvas>
                </div>

            </div>

            <!-- NETWORK -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Network / Response Time</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="networkChart"></canvas>
                </div>

            </div>

        </div>

    </main>

    <script>

        const API = "http://127.0.0.1:5001/api/v1";

        let labels = [];

        let cpuData = [];
        let memoryData = [];
        let diskData = [];
        let networkData = [];

        let cpuChart;
        let memoryChart;
        let diskChart;
        let networkChart;


        /* ================= CHART OPTIONS ================= */

        function chartOptions(label, max = 100) {

            return {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: "#8fa3b8"
                        }
                    }
                },

                scales: {

                    x: {
                        ticks: {
                            color: "#71859b"
                        },

                        grid: {
                            color: "#17283c"
                        }
                    },

                    y: {

                        min: 0,
                        max: max,

                        ticks: {
                            color: "#71859b"
                        },

                        grid: {
                            color: "#17283c"
                        }
                    }

                }

            };
        }


        /* ================= CREATE CHARTS ================= */

        function createCharts() {

            cpuChart = new Chart(
                document.getElementById("cpuChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "CPU %",
                            data: cpuData,
                            borderColor: "#39d0ff",
                            backgroundColor: "rgba(57, 208, 255, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#7ce7ff",
                            pointBorderColor: "#39d0ff",
                            fill: true
                        }]
                    },

                    options: chartOptions("CPU", 100)
                }
            );


            memoryChart = new Chart(
                document.getElementById("memoryChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Memory %",
                            data: memoryData,
                            borderColor: "#7bf0a8",
                            backgroundColor: "rgba(123, 240, 168, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#bafad1",
                            pointBorderColor: "#7bf0a8",
                            fill: true
                        }]
                    },

                    options: chartOptions("Memory", 100)
                }
            );


            diskChart = new Chart(
                document.getElementById("diskChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Disk %",
                            data: diskData,
                            borderColor: "#ffbf69",
                            backgroundColor: "rgba(255, 191, 105, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#ffd89d",
                            pointBorderColor: "#ffbf69",
                            fill: true
                        }]
                    },

                    options: chartOptions("Disk", 100)
                }
            );


            networkChart = new Chart(
                document.getElementById("networkChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Response Time (ms)",
                            data: networkData,
                            borderColor: "#ff6bb5",
                            backgroundColor: "rgba(255, 107, 181, 0.15)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#ffb0d8",
                            pointBorderColor: "#ff6bb5",
                            fill: true
                        }]
                    },

                    options: chartOptions("Network", 500)
                }
            );
        }


        /* ================= LOAD METRICS ================= */

        async function loadMetrics() {

            try {

                const response =
                    await fetch(API + "/metrics/current");

                const data =
                    await response.json();

                const metrics =
                    data.metrics || data;

                const time =
                    new Date().toLocaleTimeString();

                const cpu =
                    Number(metrics.cpu || 0);

                const memory =
                    Number(metrics.memory || 0);

                const disk =
                    Number(metrics.disk || 0);

                const latency =
                    Number(metrics.latency || 0);


                labels.push(time);

                cpuData.push(cpu);
                memoryData.push(memory);
                diskData.push(disk);
                networkData.push(latency);


                /* Keep only last 20 points */

                if (labels.length > 20) {

                    labels.shift();

                    cpuData.shift();
                    memoryData.shift();
                    diskData.shift();
                    networkData.shift();

                }


                updateCharts();

            }

            catch (error) {

                console.log(
                    "Unable to load metrics:",
                    error
                );

            }
        }


        /* ================= UPDATE CHARTS ================= */

        function updateCharts() {

            if (!cpuChart) return;


            cpuChart.data.labels = labels;

            cpuChart.data.datasets[0].data =
                cpuData;

            cpuChart.update("none");


            memoryChart.data.labels =
                labels;

            memoryChart.data.datasets[0].data =
                memoryData;

            memoryChart.update("none");


            diskChart.data.labels =
                labels;

            diskChart.data.datasets[0].data =
                diskData;

            diskChart.update("none");


            networkChart.data.labels =
                labels;

            networkChart.data.datasets[0].data =
                networkData;

            networkChart.update("none");
        }


        /* ================= START ================= */

        createCharts();

        loadMetrics();

        setInterval(
            loadMetrics,
            3000
        );

    </script>

</body>
</html>
