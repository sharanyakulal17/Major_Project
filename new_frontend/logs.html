<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AURA HEAL | Logs</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
    --bg-base: #050505;
    --surface-primary: #0A0A0A;
    --surface-secondary: #111111;
    --surface-card: #151515;
    --surface-card-hover: #1A1A1A;
    
    --border-subtle: #262626;
    --border-light: rgba(255, 255, 255, 0.08);
    --border-active: rgba(255, 255, 255, 0.35);
    
    --text-primary: #FFFFFF;
    --text-secondary: #A1A1A1;
    --text-muted: #666666;
    --text-dim: #444444;
    
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --card-radius: 12px;
    --shadow-subtle: 0 8px 30px rgba(0, 0, 0, 0.7);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-main);
    background-color: var(--bg-base);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: var(--bg-base);
}
::-webkit-scrollbar-thumb {
    background: #262626;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
    background: #444444;
}

/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 30px;
    z-index: 10000;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-heading);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    cursor: pointer;
}

.logo::before {
    content: "◈";
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #111111;
    border: 1px solid var(--border-subtle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #FFFFFF;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
    transition: all 0.3s ease;
}

.logo:hover::before {
    border-color: #FFFFFF;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
}

.logo span {
    color: var(--text-primary);
    font-weight: 700;
}

.logo::after {
    content: "OBSERVABILITY";
    font-family: var(--font-mono);
    font-size: 0.65rem;
    padding: 0.15rem 0.45rem;
    background: var(--surface-secondary);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 4px;
}

/* NAV */

.navbar {
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    height: 55px;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 30px;
    gap: 12px;
    z-index: 9999;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
    flex-wrap: nowrap;
    white-space: nowrap;
}

.navbar a {
    text-decoration: none;
    color: var(--text-secondary);
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
    border: 1px solid transparent;
}

.navbar a:hover {
    background: var(--surface-secondary);
    color: var(--text-primary);
    border-color: var(--border-subtle);
}

.navbar a.active {
    background: var(--surface-card);
    border-color: var(--border-subtle);
    color: var(--text-primary);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

.nav-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 4px 6px 4px 12px;
    min-width: min(340px, 28vw);
    margin-left: auto;
    transition: all 0.2s ease;
}

.nav-search:focus-within {
    border-color: var(--border-active);
    background: var(--surface-card);
}

.nav-search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 13px;
    min-width: 0;
    font-family: var(--font-main);
}

.nav-search input::placeholder {
    color: var(--text-muted);
}

.nav-search button {
    border: 1px solid #FFFFFF;
    background: #FFFFFF;
    color: #000000;
    padding: 6px 14px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
    transition: all 0.2s ease;
    font-family: var(--font-main);
}

.nav-search button:hover {
    background: #E5E5E5;
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}

/* MAIN */

.main {
    position: fixed;
    top: 125px;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 24px 32px;
    overflow-y: auto;
    overflow-x: hidden;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h2 {
    font-family: var(--font-heading);
    font-size: 1.95rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 4px;
}

.page-title p {
    font-family: var(--font-main);
    color: var(--text-secondary);
    font-size: 0.88rem;
    line-height: 1.5;
}

/* LOGS */

.logs-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--card-radius);
    padding: 1.25rem;
    box-shadow: var(--shadow-subtle);
}

.log {
    padding: 12px 14px;
    border-bottom: 1px solid #1E1E1E;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    transition: background 0.15s ease;
    border-radius: 6px;
    font-family: var(--font-mono);
}

.log:hover {
    background: var(--surface-card-hover);
    color: var(--text-primary);
}

.log:last-child {
    border-bottom: none;
}

.log-time {
    font-family: var(--font-mono);
    color: var(--text-muted);
    margin-right: 14px;
    font-size: 12px;
    font-weight: 500;
}

.empty {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-family: var(--font-main);
}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo-area">

        <div class="logo">
            AURA <span>HEAL</span>
        </div>

    </div>

</header>


<!-- NAVIGATION -->

<nav class="navbar">
    <div class="nav-links">
        <a href="./index3.html">
            Dashboard
        </a>

        <a href="./graphs.html">
            Graphs
        </a>

        <a href="./logs.html"
           class="active">
            Logs
        </a>

        <a href="./system-information.html">
            System Information
        </a>

        <a href="./vm.html">
            VM
        </a>
    </div>

    <div class="nav-search">
        <input type="search" placeholder="Search logs, events..." aria-label="Search logs">
        <button type="button">Search</button>
    </div>
</nav>


<!-- MAIN -->

<main class="main">

    <div class="page-title">

        <h2>
            System Logs
        </h2>

        <p>
            AURA HEAL system activity and recovery logs
        </p>

    </div>


    <div class="logs-card">

        <div id="logsContainer">

            <div class="empty">
                Loading logs...
            </div>

        </div>

    </div>

</main>


<script>

const API =
    "http://127.0.0.1:5001/api/v1";

function handleNavSearch() {
    const input = document.querySelector(".nav-search input");
    if (!input) return;

    const query = input.value.trim().toLowerCase();
    if (!query) {
        input.focus();
        return;
    }

    const searchableElements = Array.from(
        document.querySelectorAll(".page-title h2, .page-title p, .log, .empty")
    );

    let match = null;
    for (const element of searchableElements) {
        if (element.textContent.toLowerCase().includes(query)) {
            match = element;
            break;
        }
    }

    if (!match) {
        alert("No matching log entry found.");
        return;
    }

    searchableElements.forEach(el => {
        el.style.outline = "none";
        el.style.outlineOffset = "0";
    });

    match.scrollIntoView({ behavior: "smooth", block: "center" });
    match.style.outline = "2px solid #00d9ff";
    match.style.outlineOffset = "4px";

    setTimeout(() => {
        match.style.outline = "none";
        match.style.outlineOffset = "0";
    }, 1800);
}

const navSearchInput = document.querySelector(".nav-search input");
const navSearchButton = document.querySelector(".nav-search button");

if (navSearchButton) {
    navSearchButton.addEventListener("click", handleNavSearch);
}

if (navSearchInput) {
    navSearchInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            handleNavSearch();
        }
    });
}

async function loadLogs(){

    const container =
        document.getElementById(
            "logsContainer"
        );


    try{

        const response =
            await fetch(
                `${API}/logs`
            );


        const data =
            await response.json();


        const logs =
            Array.isArray(data.logs) ? data.logs : [];


        if(logs.length === 0){

            container.innerHTML =
                `<div class="empty">
                    No logs available
                </div>`;

            return;

        }


        container.innerHTML =
            logs.map(log => {

                const item =
                    typeof log === "string"
                        ? { raw: log }
                        : log || {};

                const time =
                    item.timestamp || item.time || item.createdAt || "";

                const status =
                    item.status || "INFO";

                const node =
                    item.node ? `[${item.node}] ` : "";

                const action =
                    item.action || item.raw || item.message || item.prediction || "System event";

                const prediction =
                    item.prediction || item.anomaly || "";

                const message =
                    prediction && prediction !== action
                        ? `${prediction} | ${action}`
                        : action;

                return `
                    <div class="log">
                        <span class="log-time">
                            ${time}
                        </span>
                        <span>
                            <strong>${status}</strong>
                            ${node}${message}
                        </span>
                    </div>
                `;

            }).join("");

    }
    catch(error){

        console.log(
            "Logs error:",
            error
        );


        container.innerHTML =
            `<div class="empty">
                Unable to load logs
            </div>`;

    }

}


loadLogs();

setInterval(
    loadLogs,
    5000
);

</script>

</body>
</html>
